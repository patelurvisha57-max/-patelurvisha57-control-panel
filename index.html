<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Control Panel Code Generator</title>

    <!-- PWA -->
    <meta name="theme-color" content="#7496B8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #7496B8, #CF8C78);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* padding: 10px; */
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 95%;
      height: 95%;
      background: url('patel-heater-contorl-pvt-ltd-logo-2015.webp') no-repeat center;
      background-size: contain;
      transform: translate(-50%, -50%);
      opacity: 0.05;
      z-index: 0;
    }

    .container {
      background: rgba(255,255,255,0.95);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h2 {
      font-size: 24px;
      background: linear-gradient(#ff450a, #0a63bf);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }

    .form-section { display:none; }

    .form-group {
      margin: 12px 0;
      text-align: left;
    }

    label {
      font-weight: bold;
      font-size: 13px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    button {
      display: block;
      width: 100%;
      margin: 15px auto;
      padding: 12px;
      border-radius: 8px;
      background: linear-gradient(to right, #CF8C78, #7496B8);
      color: white;
      border: none;
      cursor: pointer;
    }

    #output { display:none; }

    .code { color:#0a63bf; font-weight:bold; }
    .desc { color:#ff450a; }
  </style>
  </head>

  <body>

    <div class="container">
      <h2>CODE CREATION FORM</h2>

      <div class="form-group">
        <label for="itemSelect">ITEM:</label>
        <select id="itemSelect" onchange="showForm(this.value)">
          <option value>-- Select an item --</option>
          <option value="item1">CP-CONTROL PANEL</option>
          <option value="item2">CH-CAST HEATER</option>
          <option value="item3">IH-INDUSTRIAL HEATER</option>
          <option value="item4">MH-MICA HEATER</option>
          <option value="item5">CH-CERAMIC HEATER</option>
          <option value="item6">TH-TUBULAR HEATER</option>
          <option value="item7">IH-IMMERSION HEATER</option>
        </select>
      </div>

      <!-- CONTROL PANEL FORM -->
      <form id="item1" class="form-section" onsubmit="generateCode(event, 'CP', 'CONTROL PANEL')">
        <div class="form-group">
          <label>PHASE:</label>
          <select name="phase">
            <option value>-- Select Phase --</option>
            <option value="1P" data-full="SINGLE PHASE">1P-SINGLE PHASE</option>
            <option value="2P" data-full="TWO PHASE">2P-TWO PHASE</option>
            <option value="3P" data-full="THREE PHASE">3P-THREE PHASE</option>
          </select>
        </div>
        <div class="form-group">
          <label>OPERATION:</label>
          <select name="operation">
            <option value>-- Select Operation --</option>
            <option value="T" data-full="THYRISTOR">T-THYRISTOR</option>
            <option value="S" data-full="SSR">S-SSR</option>
            <option value="C" data-full="C-CONTACTOR">C-CONTACTOR</option>
          </select>
        </div>
        <div class="form-group">
          <label>KW RATING:</label>
          <select name="kw_rating">
            <option value>-- Select KW Rating --</option>
            <option value="4-KW" data-full="4-KW">4-KW</option>
            <option value="6-KW" data-full="6-KW">6-KW</option>
            <option value="9-KW" data-full="9-KW">9-KW</option>
            <option value="15-KW" data-full="15-KW">15-KW</option>
            <option value="18-KW" data-full="18-KW">18-KW</option>
            <option value="24-KW" data-full="24-KW">24-KW</option>
            <option value="30-KW" data-full="30-KW">30-KW</option>
            <option value="36-KW" data-full="36-KW">36-KW</option>
          </select>
        </div>
        <div class="form-group">
          <label>AMP:</label>
          <select name="amp">
            <option value>-- Select AMP --</option>
            <option value="AD" data-full="WITH ANALOG AMP MTR">AD-WITH ANALOG AMP MTR</option>
            <option value="AA" data-full="WITH DIGITAL AMP MTR">AA-WITH DIGITAL AMP MTR</option>
          </select>
        </div>
        <div class="form-group">
          <label>STARTER:</label>
          <select name="starter">
            <option value>-- Select Starter --</option>
            <option value="D1" data-full="1HP DOL">D1-1HP DOL</option>
            <option value="D2" data-full="2HP DOL">D2-2HP DOL</option>

            <option value="D4" data-full="5HP DOL">D4-5HP DOL</option>
          </select>
        </div>
        <button type="submit">Generate Code</button>
      </form>

      </div>

      <div class="result desc">

    </div>

<script>
    function showForm(itemValue) {
      document.querySelectorAll('.form-section').forEach(form => {
        form.style.display = 'none';
        form.reset();
      });
      document.getElementById("output").style.display = 'none';
      if (itemValue) document.getElementById(itemValue).style.display = 'block';
    }

    function generateCode(event, prefix, title) {
      event.preventDefault();
      const form = event.target;
      const codeParts = [prefix];
      const descParts = [title];

      form.querySelectorAll('select, input').forEach(el => {
        const val = el.value.trim();
        if (!val) return;
        if (el.tagName === 'SELECT') {
          const option = el.options[el.selectedIndex];
          codeParts.push(option.value);
          if (option.getAttribute('data-full')) descParts.push(option.getAttribute('data-full'));
        } else {
          const label = el.name.charAt(0).toUpperCase() + el.name.slice(1).replace(/_/g, ' ');
          codeParts.push(val);
          descParts.push(`${label}: ${val}`);
        }
      });

      document.getElementById('itemCode').textContent = codeParts.join('');
      document.getElementById('fullDesc').textContent = descParts.join(' ');
      document.getElementById('output').style.display = 'block';
    }

    function showTextboxes() {
      const container = document.getElementById('textboxContainer');
      container.innerHTML = '';
      const cfg = {
        BAN: ["D (mm)", "Wattage (L)", "Voltage (T)"],
        PLA: ["Width (W)", "Length (L)", "Power Rating (T)"],
        DIS: ["Outer Diameter (D)", "Thickness (T)"],
        LSH: ["Arm Length A", "Arm Length B", "Bend Radius"]
      };
      const sel = document.getElementById('category').value;
      (cfg[sel] || []).forEach(label => {
        const l = document.createElement('label');
        l.textContent = label + ':';
        const i = document.createElement('input');
        i.type = 'number';
        i.name = label.toLowerCase().replace(/[^a-z0-9]/g, '_');
        container.appendChild(l);
        container.appendChild(i);
      });
      if (!cfg[sel]) {
        const l = document.createElement('label');
        l.textContent = 'Description:';
        const i = document.createElement('input');
        i.type = 'text';
        i.name = 'custom_description';
        container.appendChild(l);
        container.appendChild(i);
      }
    }

    function copyToClipboard(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() =>
        alert('Copied: ' + text)
      ).catch(err =>
        alert('Copy failed: ' + err)
      );
    }
  </script>
